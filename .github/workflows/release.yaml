name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write
      actions: read
      checks: read

  trmnl:
    uses: ./.github/workflows/trmnl.yaml
    secrets: inherit
    permissions:
      contents: read

  release:
    needs: [ci, trmnl]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'

      - name: Build the Docker image
        if: steps.semantic.outputs.new_release_published == 'true'
        run: docker build . --file Dockerfile --tag martynvandijke/vandyke:latest --tag ghcr.io/martynvdijke/vandyke:latest

      - name: Push Docker image
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION=${{ steps.semantic.outputs.new_release_version }}
          docker tag martynvandijke/vandyke:latest martynvandijke/vandyke:$VERSION
          docker tag ghcr.io/martynvdijke/vandyke:latest ghcr.io/martynvdijke/vandyke:$VERSION

          docker push martynvandijke/vandyke:latest
          docker push martynvandijke/vandyke:$VERSION
          docker push ghcr.io/martynvdijke/vandyke:latest
          docker push ghcr.io/martynvdijke/vandyke:$VERSION

  android:
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    name: Android APK
    runs-on: ubuntu-latest
    # Non-blocking: an Android build failure never fails the release or notify.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.release.outputs.new_release_version }}
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "vandyke-${VERSION}-android.apk"
          gh release upload "v${VERSION}" "vandyke-${VERSION}-android.apk" --clobber

  notify:
    needs: [ci, release]
    if: ${{ always() }}
    name: Gotify Notification
    runs-on: ubuntu-latest
    steps:
      - name: Release Published Notification
        if: needs.ci.result == 'success' && needs.release.result == 'success' && needs.release.outputs.new_release_published == 'true'
        uses: eikendev/gotify-action@cb63800546f25c393ab96f09d12a094138c514f4 # master
        with:
          gotify_api_base: ${{ secrets.GOTIFY_API_BASE }}
          gotify_app_token: ${{ secrets.GOTIFY_APP_TOKEN }}
          notification_title: '${{ github.repository }} Release Published - ${{ needs.release.outputs.new_release_version }}'
          notification_message: '${{ github.repository }}: Version ${{ needs.release.outputs.new_release_version }} was successfully released.'

      - name: No Release Needed Notification
        if: needs.ci.result == 'success' && needs.release.result == 'success' && needs.release.outputs.new_release_published != 'true'
        uses: eikendev/gotify-action@cb63800546f25c393ab96f09d12a094138c514f4 # master
        with:
          gotify_api_base: ${{ secrets.GOTIFY_API_BASE }}
          gotify_app_token: ${{ secrets.GOTIFY_APP_TOKEN }}
          notification_title: '${{ github.repository }} Release - Up to Date'
          notification_message: 'Workflow passed but no new release was published.'

      - name: Failure Notification
        if: needs.ci.result != 'success' || needs.release.result != 'success'
        uses: eikendev/gotify-action@cb63800546f25c393ab96f09d12a094138c514f4 # master
        with:
          gotify_api_base: ${{ secrets.GOTIFY_API_BASE }}
          gotify_app_token: ${{ secrets.GOTIFY_APP_TOKEN }}
          notification_title: 'Release Failed'
          notification_message: 'The release workflow has failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          notification_priority: 5

  otel:
    permissions:
      contents: read # Required. To access the private repository
      actions: read # Required. To read workflow runs
      pull-requests: read # Optional. To read PR labels
      checks: read # Optional. To read run annotations
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [ci, release, notify]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        continue-on-error: true
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
