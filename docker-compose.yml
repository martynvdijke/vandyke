services:
  vandyke:
    build: .
    image: vandyke:latest
    container_name: vandyke
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/vandyke.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUST_PROXY: "false"
      ADD_RATE_LIMIT_PER_HOUR: "10"
      ADD_RATE_LIMIT_BURST: "5"
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_DOMAINS: ${UMAMI_DOMAINS:-}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      ADMIN_LOGIN_RATE_PER_MINUTE: "10"
      ADMIN_LOGIN_RATE_BURST: "5"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
    volumes:
      - ./data:/data
