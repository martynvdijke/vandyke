strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/v1/slip"
polling_headers: Accept=application/json
polling_body: ''
# TODO(TRMNL): replace 0 with the real plugin id from TRMNL before the next
# push. The id is pinned so trmnlp updates the existing plugin instead of
# creating a duplicate; the workflow only accepts a numeric value.
id: 0
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of vanDyke
  field_type: url
  description: The base URL of your vanDyke ledger
  placeholder: https://vandyke.example.com
  help_text: Include the protocol, without a trailing slash
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I run a self-hosted vanDyke misspelling ledger and like seeing its slip of the day on my TRMNL.
  github_url: https://github.com/martynvdijke/vandyke
  learn_more_url: https://github.com/martynvdijke/vandyke
  email_address: martyn@vandijke.xyz
name: VanDyke Slip of the Day
description: The day's misspelling, chosen by the ledger
refresh_interval: 3600
