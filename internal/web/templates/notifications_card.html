{{define "notifications-card"}}
<section class="panel notify-card" aria-labelledby="notify-card-title">
  <h2 class="panel-title" id="notify-card-title">Notifications</h2>
  <p class="panel-sub">Get a browser notification when someone adds a new entry.</p>
  <div class="notify-card-actions">
    <button class="notify-toggle" type="button" data-notify-toggle aria-pressed="false" hidden>
      <svg class="notify-icon notify-icon-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <svg class="notify-icon notify-icon-on" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-notify-label>Enable notifications</span>
    </button>
    <p class="notify-hint" data-notify-blocked hidden>Notifications blocked in your browser</p>
  </div>
  <p class="notify-state">Transport: <strong data-notify-state-line>not configured</strong></p>
</section>
{{end}}

{{define "notifications"}}{{template "notifications-card" .}}{{end}}
