name: vandyke
description: "The vanDyke Corrections Ledger — a pocket ledger of LANCo name misspellings."
publish_to: "none"
version: 1.12.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  intl: ^0.20.3
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  app_links: ^7.2.2
  permission_handler: ^13.0.2
  http_parser: ^4.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
